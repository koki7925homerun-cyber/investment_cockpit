name: Weekly strategy review

on:
  schedule:
    - cron: "0 21 * * 0" # 日曜21:00 UTC = 月曜06:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-strategy
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review data/strategy.json
        env:
          # 未設定なら strategy.json は変更されない(戦略の骨子は判断そのものなので
          # ルールベースでは書き換えない)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-strategy.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strategy.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: weekly strategy review ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i); rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          echo "push failed after 5 attempts"
          exit 1
